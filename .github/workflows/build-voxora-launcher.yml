# =============================================================================
#  VOXORA LAUNCHER - build otomatis di GitHub
#  Versi modifikasi TIDAK RESMI (Unofficial Modified Version) dari Zalith Launcher 2
#  Lisensi: GPL-3.0 (kode sumber perubahan ikut diunggah sebagai artifact "Voxora-source")
# =============================================================================
#
#  CARA PAKAI (3 langkah, semuanya lewat browser HP):
#   1. Di repository GitHub-mu: tab Actions > "set up a workflow yourself".
#      Hapus semua isi editor, tempel SELURUH isi file ini, lalu tekan Commit changes.
#      (Atau simpan file ini sebagai: .github/workflows/build-voxora.yml)
#   2. Tab Actions > "Build Voxora Launcher" > Run workflow > Run workflow (pilih arm64).
#   3. Tunggu sekitar 25-45 menit sampai muncul centang hijau. Buka halaman utama
#      repository > "Releases" > ketuk file .apk untuk mengunduh, lalu pasang di HP.
#      (Cadangan: buka run-nya > bagian Artifacts > "Voxora-Launcher-arm64".)
#
#  OPSIONAL - Settings > Secrets and variables > Actions > New repository secret:
#   - OAUTH_CLIENT_ID    : client ID aplikasi Azure milikmu (untuk login akun Microsoft)
#   - CURSEFORGE_API_KEY : kunci API CurseForge (mod dari CurseForge; Modrinth jalan tanpa kunci)
#
#  Voxora Launcher BUKAN produk resmi Minecraft dan tidak berafiliasi dengan Mojang/Microsoft.
#  Minecraft Java Edition adalah game berbayar; launcher ini hanya pembukanya.
# =============================================================================

name: Build Voxora Launcher

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Arsitektur HP (arm64 untuk hampir semua HP modern)"
        type: choice
        default: arm64
        options: [arm64, arm, x86_64, x86, all]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      ARCH: ${{ inputs.arch || 'arm64' }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Ambil kode sumber Zalith Launcher 2 (versi yang sudah diuji)
        uses: actions/checkout@v6
        with:
          repository: ZalithLauncher/ZalithLauncher2
          ref: bf1e2e9db9bfe6097c7981ae8997a79c3866dd06
          submodules: recursive

      - name: Siapkan berkas Voxora (ikon, tema, mesin AI)
        shell: bash
